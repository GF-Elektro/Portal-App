name: Deploy docs to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Attach Android APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p docs/downloads
          if gh release download --repo "${{ github.repository }}" --pattern '*.apk' --dir "$RUNNER_TEMP/apk"; then
            apk="$(find "$RUNNER_TEMP/apk" -name '*.apk' | head -n 1)"
            cp "$apk" docs/downloads/GFElektroPortal.apk
            echo "Attached $(basename "$apk") as docs/downloads/GFElektroPortal.apk"
          else
            echo "No APK on the latest GitHub Release; skipping Android download file."
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './docs'
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
