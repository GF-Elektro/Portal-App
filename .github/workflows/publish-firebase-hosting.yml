name: Publish Firebase Hosting packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.44)'
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  hosting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve release tag
        id: ver
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG="${INPUT_TAG:-$RELEASE_TAG}"
          if [ -z "$TAG" ]; then
            echo "No tag provided" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Install apt index tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev apt-utils

      - name: Pull Arch builder image
        run: |
          for attempt in 1 2 3 4 5; do
            if docker pull archlinux:base-devel; then
              exit 0
            fi
            echo "docker pull failed (attempt $attempt); retrying..."
            sleep 15
          done
          exit 1

      - name: Stage hosting directory
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.ver.outputs.tag }}
        run: bash scripts/stage-hosting.sh

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: gfe-portal-packages
          workload_identity_provider: projects/17403236372/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deploy@gfe-portal-packages.iam.gserviceaccount.com

      - name: Deploy Hosting
        run: npx --yes firebase-tools@latest deploy --only hosting --project gfe-portal-packages --non-interactive
