name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci || npm install

      - name: Install Linux System Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libfuse2

      - name: Build and Publish (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder build --linux --publish always

      - name: Build and Publish (macOS DMG)
        if: matrix.os == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "APPLE_CERTIFICATE_BASE64 is unset; publishing an unsigned DMG."
            unset CSC_LINK CSC_KEY_PASSWORD
          fi
          if [ -n "$APPLE_API_KEY_BASE64" ]; then
            KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$KEY_PATH"
            export APPLE_API_KEY="$KEY_PATH"
          else
            echo "APPLE_API_KEY_BASE64 is unset; skipping notarization."
            unset APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID
          fi
          npx electron-builder build --mac dmg --publish always

  release-windows:
    name: Build and Release (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci || npm install

      - name: Build Windows installers (unsigned)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: npx electron-builder build --win --publish never

      - name: Azure login (Windows signing)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows installers (Artifact Signing)
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: gfelektro-signing
          certificate-profile-name: portal-eu-public
          files-folder: ${{ github.workspace }}/release
          files-folder-filter: exe
          files-folder-recurse: false
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Publish Windows artifacts (signed)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path release -File | ForEach-Object { $_.FullName }
          if (-not $files) {
            throw "No files in release/ to publish."
          }
          npx electron-builder publish -f $files -p always

  release-windows-store:
    name: Build Windows Store AppX
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci || npm install

      - name: Build unsigned AppX for Partner Center
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        shell: pwsh
        run: |
          Remove-Item Env:CSC_LINK -ErrorAction SilentlyContinue
          Remove-Item Env:CSC_KEY_PASSWORD -ErrorAction SilentlyContinue
          Remove-Item Env:WIN_CSC_LINK -ErrorAction SilentlyContinue
          Remove-Item Env:WIN_CSC_KEY_PASSWORD -ErrorAction SilentlyContinue
          npx electron-builder build --win appx --publish never --config.win.executableName=GFPortalEU

      - name: Upload AppX to GitHub Actions
        uses: actions/upload-artifact@v7
        with:
          name: GFElektroPortal-appx
          path: |
            release/*.appxupload
            release/*.appx
          if-no-files-found: error

      - name: Attach AppX to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $uploads = Get-ChildItem -Path release -File | Where-Object { $_.Extension -in '.appxupload', '.appx' }
          if (-not $uploads) {
            throw "No .appx / .appxupload in release/"
          }
          $tag = $env:GITHUB_REF_NAME
          $ready = $false
          for ($i = 0; $i -lt 24; $i++) {
            gh release view $tag --repo ${{ github.repository }} | Out-Null
            if ($LASTEXITCODE -eq 0) { $ready = $true; break }
            Start-Sleep -Seconds 15
          }
          if (-not $ready) {
            throw "GitHub Release $tag does not exist yet; cannot attach AppX."
          }
          gh release upload $tag --repo ${{ github.repository }} --clobber @($uploads | ForEach-Object { $_.FullName })

  ios-testflight:
    name: Upload iOS to TestFlight
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7

      - name: Upload to TestFlight
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_IOS_CERTIFICATE_BASE64: ${{ secrets.APPLE_IOS_CERTIFICATE_BASE64 }}
          APPLE_IOS_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_IOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_API_KEY_BASE64" ]; then
            echo "APPLE_API_KEY_BASE64 is unset; skipping TestFlight upload."
            exit 0
          fi
          if [ -n "$APPLE_IOS_CERTIFICATE_BASE64" ]; then
            CERT_PATH="$RUNNER_TEMP/ios_distribution.p12"
            printf '%s' "$APPLE_IOS_CERTIFICATE_BASE64" | base64 -D > "$CERT_PATH"
            KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
            security create-keychain -p actions "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p actions "$KEYCHAIN_PATH"
            security import "$CERT_PATH" -P "$APPLE_IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security list-keychain -d user -s "$KEYCHAIN_PATH"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions "$KEYCHAIN_PATH"
          else
            echo "APPLE_IOS_CERTIFICATE_BASE64 is unset; relying on App Store Connect API + -allowProvisioningUpdates."
          fi
          export APPLE_API_KEY_BASE64
          export MARKETING_VERSION="${GITHUB_REF_NAME#v}"
          export CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
          bash scripts/ios-testflight.sh
